version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: limo-postgres
    environment:
      POSTGRES_USER: limo_user
      POSTGRES_PASSWORD: limo_password
      POSTGRES_DB: limo_booking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U limo_user -d limo_booking']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16
    container_name: limo-postgres-init
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: limo_user
      PGPASSWORD: limo_password
      PGDATABASE: limo_booking
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        until pg_isready -h postgres -U limo_user -d limo_booking; do sleep 1; done
        DB_EXISTS=$$(psql -h postgres -U limo_user -d limo_booking -tc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | tr -d ' ')
        if [ "$$DB_EXISTS" != "1" ]; then
          psql -h postgres -U limo_user -d limo_booking -c 'CREATE DATABASE keycloak'
          echo 'Keycloak database created'
        else
          echo 'Keycloak database already exists'
        fi

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: limo-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: limo_user
      KC_DB_PASSWORD: limo_password
    ports:
      - '8080:8080'
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
